<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#0b0d12"/><text x="100" y="110" font-family="Arial" font-size="22" fill="#93c5fd" letter-spacing="2">DAY 03 • TRUST THROUGH UNCERTAINTY</text><text x="100" y="180" font-family="Arial" font-size="54" font-weight="700" fill="white">A deterministic rule should know when to stop.</text><rect x="100" y="270" width="320" height="160" rx="18" fill="#111827" stroke="#374151"/><text x="135" y="325" font-family="Arial" font-size="18" font-weight="700" fill="#93c5fd">INPUT</text><text x="135" y="370" font-family="Arial" font-size="24" fill="white">Synthetic ticket text</text><text x="135" y="402" font-family="Arial" font-size="18" fill="#cbd5e1">normalized locally</text><text x="465" y="360" font-family="Arial" font-size="50" fill="#93c5fd">→</text><rect x="540" y="270" width="360" height="160" rx="18" fill="#111827" stroke="#374151"/><text x="575" y="325" font-family="Arial" font-size="18" font-weight="700" fill="#93c5fd">RULE EVIDENCE</text><text x="575" y="370" font-family="Arial" font-size="24" fill="white">0, 1, or 2+ categories</text><text x="575" y="402" font-family="Arial" font-size="18" fill="#cbd5e1">explicit matched signals</text><text x="945" y="360" font-family="Arial" font-size="50" fill="#93c5fd">→</text><rect x="1020" y="235" width="320" height="110" rx="18" fill="#064e3b"/><text x="1055" y="280" font-family="Arial" font-size="18" font-weight="700" fill="#a7f3d0">EXACTLY 1</text><text x="1055" y="320" font-family="Arial" font-size="26" font-weight="700" fill="white">RESOLVED</text><rect x="1020" y="365" width="320" height="110" rx="18" fill="#78350f"/><text x="1055" y="410" font-family="Arial" font-size="18" font-weight="700" fill="#fde68a">0 OR 2+</text><text x="1055" y="450" font-family="Arial" font-size="26" font-weight="700" fill="white">REVIEW</text><rect x="100" y="555" width="1240" height="190" rx="20" fill="#111827" stroke="#374151"/><text x="140" y="615" font-family="Arial" font-size="28" font-weight="700" fill="white">The trust promise</text><text x="140" y="665" font-family="Arial" font-size="22" fill="#cbd5e1">Resolved decisions expose category, severity, stable rule ID, matched signals, and reason.</text><text x="140" y="705" font-family="Arial" font-size="22" fill="#cbd5e1">Uncertain evidence stays uncertain. The tool does not manufacture a confident answer.</text><text x="100" y="830" font-family="Arial" font-size="18" fill="#93c5fd">CTA: INSPECT THE RULES</text></svg>